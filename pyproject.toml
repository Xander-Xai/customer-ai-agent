[project]
name = "customer-service-ai-agent"
version = "6.3"
description = "药妆智多星多智能体客服系统"
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "SIM108", # use ternary operator (sometimes less readable)
    "UP007",  # use X | Y for union types (not all environments support it)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "logger", "exceptions", "agents", "api", "auth", "cache", "collaboration", "core", "db", "erp", "knowledge", "llm", "media", "rag", "router", "session_manager", "tools"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# `scripts/` holds operational CLIs (including `test_worker_crash_recovery.py`,
# the runtime chaos acceptance script). Without this, bare `pytest` from the repo
# root imports that script as a test module under the name
# `test_worker_crash_recovery`, which collides with the real test module
# `tests/integration/test_worker_crash_recovery.py` and aborts collection with
# "import file mismatch". Operational scripts are exercised via their Makefile
# targets (`make runtime-chaos`), never by pytest collection.
norecursedirs = ["scripts", "deploy", "htmlcov", "node_modules", ".venv", ".worktrees", ".claude"]
markers = [
    "integration: 集成测试（真实子进程 / 真实基础设施；离线可跑，不依赖外部服务）",
    "real_llm: 真实 LLM 端到端测试（需要真实 API Key，默认跳过）",
    "stress: 压力测试（耗时较长）",
    "xdist_group: 组隔离执行标识",
    "unit: 单元测试（快速、隔离、无外部依赖）",
    "slow: 慢测试（通过 -m 'not slow' 跳过）",
    "timeout: per-test timeout (pytest-timeout; no-op if the plugin is absent)",
]
asyncio_mode = "auto"
addopts = "--cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = [
    "agents",
    "alerts",
    "api",
    "auth",
    "cache",
    "collaboration",
    "core",
    "db",
    "erp",
    "knowledge",
    "llm",
    "media",
    "rag",
    "router",
    "tools",
]
omit = [
    "tests/*",
    ".venv/*",
    "venv/*",
    "*/__pycache__/*",
    "*/conftest.py",
    "web/*",
    "docs/*",
    "scripts/*",
    "deploy/*",
    "monitoring/*",
    "nginx/*",
    "loki/*",
    "data/*",
    "htmlcov/*",
    "node_modules/*",
    "alembic/*",
    "*erp/kingdee_real_adapter.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
omit = [
    "*erp/kingdee_real_adapter.py",
]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["core.protocols.*", "core.token_tracker.*", "core.prompt_manager.*", "rag.reranker.*", "rag.query_rewriter.*", "api.dependencies.*"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["core.graph_builder.*", "core.session.*"]
disallow_untyped_defs = false
no_implicit_optional = false

[[tool.mypy.overrides]]
module = ["multi_agent_customer_service.*"]
disallow_untyped_defs = false
no_implicit_optional = false

[[tool.mypy.overrides]]
module = ["core.config", "config"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["erp.kingdee_adapter"]
disallow_untyped_defs = false
